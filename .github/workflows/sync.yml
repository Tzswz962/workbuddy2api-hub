# ============================================================
# 自动同步上游主仓库 → 你的复刻仓库
# 特点：同步上游最新代码的同时，绝对保留本文件自身不被覆盖
# ============================================================

name: Sync Upstream

on:
  schedule:
    # 每天 UTC 1:00（北京时间早上 9:00）自动运行
    - cron: '0 1 * * *'
  workflow_dispatch:
    # 允许在 Actions 页面手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # ★★★ 必须加上这一步：先把你的仓库拉取到运行环境中 ★★★
      - name: Checkout target repo
        uses: actions/checkout@v5

      - name: Sync fork with upstream
        env:
          # ========== 需要改的地方只有这三行 ==========
          UPSTREAM_REPO: https://github.com/ardeyouxipianyi/workbuddy2api-hub.git
          TARGET_REPO: Tzswz962/workbuddy2api-hub
          SYNC_BRANCH: main
          # ============================================
          REPO_TOKEN: ${{ secrets.SYNC_TOKEN }}

        run: |
          set -e

          # 带 Token 的目标仓库地址（用于 push）
          TARGET_URL="https://x-access-token:${REPO_TOKEN}@github.com/${TARGET_REPO}.git"

          # ---------- 1. 先备份当前仓库里的 sync.yml ----------
          # 因为上一步已经 checkout，所以现在这个文件是存在的
          cp .github/workflows/sync.yml /tmp/sync.yml.bak
          echo "✅ 已备份当前的 sync.yml"

          # ---------- 2. 克隆上游仓库（普通克隆，不是 bare）----------
          git clone --branch "$SYNC_BRANCH" --depth 1 "$UPSTREAM_REPO" sync-work
          cd sync-work

          # ---------- 3. 强行把备份的 sync.yml 覆盖回来 ----------
          mkdir -p .github/workflows
          cp /tmp/sync.yml.bak .github/workflows/sync.yml
          echo "✅ 已强行恢复 sync.yml，防止被上游覆盖或删除"

          # ---------- 4. 提交并强制推送到你的复刻 ----------
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "sync: update from upstream (keep sync.yml)" || echo "无新变更"

          git push --force "$TARGET_URL" "HEAD:$SYNC_BRANCH"

          echo "✅ 同步完成"
